services:
  - type: web
    name: horilla
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn horilla.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: horilla-db
          property: connectionString

databases:
  - name: horilla-db
    databaseName: horilla
    user: horilla
    plan: free
